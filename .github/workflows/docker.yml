name: Build and publish containers

on:
  push:
    branches: [main]
    paths:
      - 'modules/run_copykat/Dockerfile'
      - 'modules/annotate_h5ad/Dockerfile'
      - '.github/workflows/docker.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'modules/run_copykat/Dockerfile'
      - 'modules/annotate_h5ad/Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # The CopyKAT R stack. Bioconductor publishes amd64 only.
          - variant: r
            context: modules/run_copykat
            platforms: linux/amd64
            suffix: ''
          # The scanpy stack for ANNOTATE_H5AD / CONCAT_H5ADS. Multi-arch so it
          # runs natively on Apple Silicon for local testing.
          - variant: py
            context: modules/annotate_h5ad
            platforms: linux/amd64,linux/arm64
            suffix: '-py'

    name: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      # Pull requests build but never push, so a broken Dockerfile fails review
      # instead of shipping.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
